name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo check --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      # -D warnings makes Clippy findings fail the job.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Translator coverage tests use vendored Zotero translator sources.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      # Build with the deployed base path.
      - name: Build the site
        run: npm run build
        working-directory: website
        env:
          BASE_PATH: /rotero
      # Report-only coverage check.
      - name: Check user guide coverage
        run: node website/tooling/coverage/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-coverage
          path: website/tooling/coverage/report.md

  website:
    name: Website
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          BASE_PATH: /rotero
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
      - id: deploy
        uses: actions/deploy-pages@v4

  check-ios:
    name: Check iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target aarch64-apple-ios --features mobile --no-default-features

  # Check Windows-specific compilation and run tests.
  check-windows:
    name: Check Windows
    runs-on: windows-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --no-run
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

  # Run tests on macOS.
  test-macos:
    name: Test macOS
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --no-run
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --workspace

  # Build the macOS application bundle and smoke-test the real artifact.
  bundle-smoke:
    name: Bundle smoke (macOS)
    runs-on: macos-latest
    if: |
      github.ref == 'refs/heads/master' ||
      contains(github.event.pull_request.labels.*.name, 'bundle-smoke')
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: cargo-bins/cargo-binstall@b629f84e79e8fbc4f76616a8efd340f3ea605cab # v1.21.1
      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli --version 0.7.10 -y --force
      - uses: taiki-e/install-action@just
      - name: Free disk before bundle
        run: |
          rm -rf target/debug || true
          df -h
      - name: Bundle
        run: dx bundle --release --package-types macos
      - name: Smoke the bundle
        run: ./scripts/smoke-bundle.sh target/dx/rotero/release/macos/Rotero.app

  # Build a native Linux ARM64 Debian package.
  build-linux-aarch64:
    name: Build Linux ARM64 DEB
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: cargo-bins/cargo-binstall@b629f84e79e8fbc4f76616a8efd340f3ea605cab # v1.21.1

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli --version 0.7.10 -y --force

      - uses: taiki-e/install-action@just

      - name: Build Linux ARM64 DEB
        run: dx bundle --release --package-types deb

      - name: Locate Debian packages
        run: |
          echo "Searching for generated .deb packages..."
          find target/dx -type f -name '*.deb' -print

          if ! find target/dx -type f -name '*.deb' -print -quit | grep -q .; then
            echo "::error::No .deb package was generated. Check Dioxus bundler configuration."
            exit 1
          fi

      - name: Upload Linux ARM64 DEB
        uses: actions/upload-artifact@v4
        with:
          name: rotero-linux-aarch64-deb
          path: target/dx/**/*.deb
          if-no-files-found: error
          retention-days: 14
          
